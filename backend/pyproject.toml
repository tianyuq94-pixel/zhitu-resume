[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-backend"
version = "0.1.0"
description = "Backend API for the AI Career Assistant website"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi>=0.141,<0.142",
    "httpx2>=2.12,<3",
    "pymupdf>=1.28,<1.29",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.13,<3",
    "pymysql>=1.2,<2",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.32,<0.1",
    "reportlab>=4.4,<5",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
